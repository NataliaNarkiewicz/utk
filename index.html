<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<title>Mecze</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#071a17;
color:white;
}

/* HEADER */

header{
text-align:center;
padding:25px;
font-size:26px;
font-weight:bold;
background:linear-gradient(90deg,#00ffc3,#00997a);
color:#022;
}

/* TABS */

.tabs{
display:flex;
justify-content:center;
gap:15px;
padding:20px;
}

.tabs button{
padding:12px 24px;
border:none;
border-radius:20px;
background:#0c2a26;
color:#00ffc3;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.tabs button:hover{
background:#123b35;
}

/* CONTAINER */

.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* MATCH CARD */

.match{
background:#0c2a26;
padding:20px;
margin-bottom:14px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

.match:hover{
transform:scale(1.02);
box-shadow:0 0 12px #00ffc366;
}

/* GRID TEAMS */

.match-row{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
font-weight:bold;
font-size:18px;
}

/* TEAM */

.team-left{
text-align:left;
}

.team-right{
text-align:right;
}

/* DATE */

.date{
text-align:center;
font-size:14px;
opacity:0.7;
margin-top:6px;
}

/* SCORE */

.score{
text-align:center;
font-size:20px;
margin-top:8px;
font-weight:bold;
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000cc;
display:none;
align-items:center;
justify-content:center;
}

.modal-content{
background:#0c2a26;
padding:30px;
border-radius:12px;
max-width:420px;
width:90%;
}

.close{
margin-top:20px;
cursor:pointer;
text-align:center;
color:#00ffc3;
}

</style>

</head>

<body>

<header>MECZE</header>

<div class="tabs">
<button onclick="showMatches('upcoming')">NADCHODZĄCE</button>
<button onclick="showMatches('finished')">ZAKOŃCZONE</button>
</div>

<div class="container" id="matches"></div>

<div class="modal" id="modal">
<div class="modal-content">

<h2 id="modalTeams"></h2>
<div id="stats"></div>

<div class="close" onclick="closeModal()">Zamknij</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {

apiKey:"API_KEY",
authDomain:"PROJECT.firebaseapp.com",
projectId:"PROJECT",
storageBucket:"PROJECT.appspot.com",
messagingSenderId:"ID",
appId:"APP_ID"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let matches=[];

async function loadMatches(){

const querySnapshot = await getDocs(collection(db,"matches"));

matches=[];

querySnapshot.forEach(doc=>{
matches.push(doc.data());
});

showMatches("upcoming");

}

window.showMatches=function(type){

const container=document.getElementById("matches");
container.innerHTML="";

matches.forEach(m=>{

/* NADCHODZĄCE */

if(type==="upcoming" && !m.finished){

container.innerHTML+=`

<div class="match" onclick='openMatch(${JSON.stringify(m)})'>

<div class="match-row">

<div class="team-left">
${m.team1}
</div>

<div>
${new Date(m.date).toLocaleDateString()} <br>
${new Date(m.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
</div>

<div class="team-right">
${m.team2}
</div>

</div>

</div>

`;

}

/* ZAKOŃCZONE */

if(type==="finished" && m.finished){

container.innerHTML+=`

<div class="match" onclick='openMatch(${JSON.stringify(m)})'>

<div class="match-row">

<div class="team-left">
${m.team1}
</div>

<div class="score">
${m.score1} : ${m.score2}
</div>

<div class="team-right">
${m.team2}
</div>

</div>

</div>

`;

}

});

}

/* MODAL */

window.openMatch=function(m){

document.getElementById("modal").style.display="flex";

document.getElementById("modalTeams").innerText=
m.team1+" vs "+m.team2;

document.getElementById("stats").innerHTML=`

<p>Zabójstwa ${m.team1}: ${m.kills1}</p>
<p>Zabójstwa ${m.team2}: ${m.kills2}</p>

<p>Asysty ${m.team1}: ${m.assists1}</p>
<p>Asysty ${m.team2}: ${m.assists2}</p>

`;

}

window.closeModal=function(){

document.getElementById("modal").style.display="none";

}

loadMatches();

</script>

</body>
</html>

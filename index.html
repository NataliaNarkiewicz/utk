<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mecze</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Segoe UI, Arial;
background:#050507;
color:white;
min-height:100vh;
position:relative;
overflow-x:hidden;
}

/* Rozmazane logo w tle */

body::before{
content:"";
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:700px;
height:700px;
background:url("zse-logo.png") center/contain no-repeat;
opacity:0.05;
filter:blur(8px);
pointer-events:none;
}

/* kontener */

.container{
width:1000px;
margin:auto;
padding:50px 20px;
}

/* nagłówki sekcji */

.section-title{
font-size:26px;
margin-bottom:20px;
letter-spacing:1px;
color:#00e0ff;
border-left:3px solid #00e0ff;
padding-left:12px;
}

/* lista meczów */

.matches{
display:grid;
gap:14px;
margin-bottom:50px;
}

/* karta meczu */

.match{
background:#0d0d14;
border:1px solid #1a1a24;
border-radius:10px;
padding:18px 22px;
cursor:pointer;
transition:0.25s;
}

.match:hover{
border-color:#00e0ff;
box-shadow:0 0 15px rgba(0,224,255,0.25);
transform:translateY(-2px);
}

/* rząd drużyn */

.row{
display:flex;
justify-content:space-between;
align-items:center;
}

.team{
font-size:18px;
font-weight:600;
}

.time{
font-size:14px;
color:#8f9bff;
}

/* szczegóły meczu */

.details{
display:none;
margin-top:15px;
padding-top:15px;
border-top:1px solid #1a1a24;
}

/* statystyki */

.stats{
display:flex;
gap:16px;
}

.stat{
background:#09090f;
border:1px solid #1c1c28;
padding:8px 12px;
border-radius:6px;
font-size:14px;
}

.stat span{
color:#00e0ff;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="section-title">
Nadchodzące mecze
</div>

<div class="matches">

<div class="match">
<div class="row">
<div class="team">Fire Squad</div>
<div class="time">21.03.2026 • 18:00</div>
<div class="team">Night Wolves</div>
</div>
</div>

<div class="match">
<div class="row">
<div class="team">Sky Hunters</div>
<div class="time">22.03.2026 • 19:30</div>
<div class="team">Shadow Team</div>
</div>
</div>

</div>


<div class="section-title">
Zakończone mecze
</div>

<div class="matches">

<div class="match" onclick="toggle(this)">

<div class="row">
<div class="team">Fire Squad</div>
<div class="time">18.03.2026 • 18:00</div>
<div class="team">Shadow Team</div>
</div>

<div class="details">

<div class="stats">
<div class="stat">Kills: <span>42</span></div>
<div class="stat">Deaths: <span>30</span></div>
<div class="stat">Assists: <span>11</span></div>
</div>

</div>

</div>


<div class="match" onclick="toggle(this)">

<div class="row">
<div class="team">Night Wolves</div>
<div class="time">17.03.2026 • 20:00</div>
<div class="team">Sky Hunters</div>
</div>

<div class="details">

<div class="stats">
<div class="stat">Kills: <span>37</span></div>
<div class="stat">Deaths: <span>33</span></div>
<div class="stat">Assists: <span>9</span></div>
</div>

</div>

</div>

</div>

</div>


<script>

function toggle(el){

let details = el.querySelector(".details");

if(!details) return;

details.style.display =
details.style.display === "block"
? "none"
: "block";

}

</script>

</body>
</html>

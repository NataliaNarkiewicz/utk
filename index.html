<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mecze</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle at top, #1b1b3a, #000);
    color:white;
}

.container{
    width:900px;
    margin:auto;
    padding:40px;
}

h2{
    text-align:center;
    margin-top:40px;
}

.matches{
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
}

.match{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    padding:18px;
    cursor:pointer;
    transition:0.3s;
    position:relative;
}

.match:hover{
    transform:scale(1.02);
    border-color:#ff4bff;
    box-shadow:0 0 15px #ff4bff66;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.team{
    font-weight:bold;
    font-size:18px;
}

.time{
    color:#ff4bff;
}

.details{
    display:none;
    margin-top:10px;
    font-size:14px;
    color:#ccc;
}

</style>
</head>
<body>

<div class="container">

<h2>🎆 Nadchodzące mecze</h2>

<div class="matches">

<div class="match" onclick="toggle(this)">
<div class="row">
<div class="team">Fire Squad</div>
<div class="time">21.03 • 18:00</div>
<div class="team">Night Wolves</div>
</div>
</div>

<div class="match" onclick="toggle(this)">
<div class="row">
<div class="team">Sky Hunters</div>
<div class="time">22.03 • 19:30</div>
<div class="team">Shadow Team</div>
</div>
</div>

</div>


<h2>🎇 Zakończone mecze</h2>

<div class="matches">

<div class="match" onclick="toggle(this)">
<div class="row">
<div class="team">Fire Squad</div>
<div class="time">15.03 • 18:00</div>
<div class="team">Shadow Team</div>
</div>

<div class="details">
Zabójstwa: 42<br>
Asysty: 11<br>
Śmierci: 30
</div>

</div>


<div class="match" onclick="toggle(this)">
<div class="row">
<div class="team">Night Wolves</div>
<div class="time">14.03 • 20:00</div>
<div class="team">Sky Hunters</div>
</div>

<div class="details">
Zabójstwa: 37<br>
Asysty: 9<br>
Śmierci: 33
</div>

</div>

</div>

</div>

<script>

function toggle(el){
    let details = el.querySelector(".details");
    if(details){
        details.style.display =
            details.style.display === "block"
            ? "none"
            : "block";
    }
}

</script>

</body>
</html>

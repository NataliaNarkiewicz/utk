<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mecze</title>

<style>

body{
background:#031e1b;
color:#00ffc8;
font-family:Arial;
margin:0;
}

.app{
max-width:420px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tabs button{
flex:1;
background:#06332d;
border:none;
padding:10px;
color:#00ffc8;
cursor:pointer;
}

.tabs button:hover{
background:#0c4b42;
}

.match{
background:#0b3a33;
padding:15px;
margin-bottom:10px;
border-radius:6px;
}

.teams{
font-size:18px;
font-weight:bold;
}

.time{
opacity:0.7;
}

</style>

</head>

<body>

<div class="app">

<h1>MECZE</h1>

<div class="tabs">
<button onclick="showMatches('upcoming')">NADCHODZĄCE</button>
<button onclick="showMatches('finished')">ZAKOŃCZONE</button>
<button onclick="showMatches('cancelled')">ANULOWANE</button>
</div>

<div id="matches"></div>

</div>

<script>

let matches = []

async function loadMatches(){

let res = await fetch("/api/mecze")
matches = await res.json()

showMatches("upcoming")

}

function formatDate(seconds){

let date = new Date(seconds*1000)

return date.toLocaleDateString()+" "+
date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})

}

function showMatches(type){

let container = document.getElementById("matches")
container.innerHTML=""

matches.forEach(m=>{

if(type==="upcoming" && !m.zakonczone && !m.anulowane){

renderMatch(m)

}

if(type==="finished" && m.zakonczone){

renderMatch(m)

}

if(type==="cancelled" && m.anulowane){

renderMatch(m)

}

})

}

function renderMatch(m){

let container = document.getElementById("matches")

container.innerHTML += `
<div class="match">
<div class="teams">${m.team1} vs ${m.team2}</div>
<div class="time">${formatDate(m.data_meczu._seconds)}</div>
</div>
`

}

loadMatches()

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Matches</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:#0a0a0f;
color:white;
}

.container{
width:1000px;
margin:auto;
padding:40px;
}

.title{
font-size:28px;
margin:40px 0 20px 0;
color:#00eaff;
text-shadow:0 0 10px #00eaff;
}

.matches{
display:grid;
gap:16px;
}

.match{
background:#111118;
border:1px solid #1f1f2e;
border-radius:10px;
padding:20px;
cursor:pointer;
transition:0.25s;
position:relative;
overflow:hidden;
}

.match:hover{
border-color:#00eaff;
box-shadow:0 0 15px #00eaff55;
transform:translateY(-2px);
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
}

.team{
font-size:18px;
font-weight:600;
}

.time{
color:#9b9bff;
font-size:14px;
}

.details{
display:none;
margin-top:15px;
padding-top:15px;
border-top:1px solid #222;
color:#aaa;
}

.stats{
display:flex;
gap:20px;
margin-top:8px;
}

.stat{
background:#0f0f16;
padding:8px 12px;
border-radius:6px;
border:1px solid #222;
}

.stat span{
color:#00eaff;
font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<div class="title">⚡ Nadchodzące mecze</div>

<div class="matches">

<div class="match">
<div class="row">
<div class="team">Fire Squad</div>
<div class="time">21.03 • 18:00</div>
<div class="team">Night Wolves</div>
</div>
</div>

<div class="match">
<div class="row">
<div class="team">Sky Hunters</div>
<div class="time">22.03 • 19:30</div>
<div class="team">Shadow Team</div>
</div>
</div>

</div>


<div class="title">🏆 Zakończone mecze</div>

<div class="matches">

<div class="match" onclick="toggle(this)">

<div class="row">
<div class="team">Fire Squad</div>
<div class="time">15.03 • 18:00</div>
<div class="team">Shadow Team</div>
</div>

<div class="details">

<div class="stats">
<div class="stat">Kills: <span>42</span></div>
<div class="stat">Deaths: <span>30</span></div>
<div class="stat">Assists: <span>11</span></div>
</div>

</div>

</div>


<div class="match" onclick="toggle(this)">

<div class="row">
<div class="team">Night Wolves</div>
<div class="time">14.03 • 20:00</div>
<div class="team">Sky Hunters</div>
</div>

<div class="details">

<div class="stats">
<div class="stat">Kills: <span>37</span></div>
<div class="stat">Deaths: <span>33</span></div>
<div class="stat">Assists: <span>9</span></div>
</div>

</div>

</div>

</div>

</div>

<script>

function toggle(el){
let d = el.querySelector(".details");
if(!d) return;

d.style.display =
d.style.display === "block"
? "none"
: "block";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mecze</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Segoe UI, Arial, sans-serif;
  background: #000000;
  color: white;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Rozmazane logo w tle */
body::before {
  content: "";
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 700px;
  height: 700px;
  background: url("zselogo.png") center/contain no-repeat;
  opacity: 0.05;
  filter: blur(8px);
  pointer-events: none;
}

/* Kontener główny */
.container {
  width: 1000px;
  margin: auto;
  padding: 50px 20px;
}

/* Nagłówki sekcji */
.section-title {
  font-size: 26px;
  margin-bottom: 20px;
  letter-spacing: 1px;
  color: #ff8c00;
  border-left: 3px solid #ff8c00;
  padding-left: 12px;
}

/* Lista meczów */
.matches {
  display: grid;
  gap: 14px;
  margin-bottom: 50px;
}

/* Karta meczu */
.match {
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  border-radius: 10px;
  padding: 18px 22px;
  cursor: pointer;
  transition: 0.25s;
}

.match:hover {
  border-color: #ff8c00;
  box-shadow: 0 0 15px rgba(255, 140, 0, 0.35);
  transform: translateY(-2px);
}

/* Rząd drużyn */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.team {
  font-size: 18px;
  font-weight: 600;
}

.time {
  font-size: 14px;
  color: #ffb566;
}

/* Szczegóły meczu */
.details {
  display: none;
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid #1a1a1a;
}

/* Statystyki */
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.stat {
  background: #111;
  border: 1px solid #222;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 14px;
  width: 180px;
}

.stat span {
  color: #ff8c00;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

  <div class="section-title">Nadchodzące mecze</div>
  <div id="nadchodzace" class="matches"></div>

  <div class="section-title">Zakończone mecze</div>
  <div id="zakonczone" class="matches"></div>

</div>

<script>
/* TWOJA BAZA DANYCH */
const mecze = [
  {
    "id": "A_B",
    "team1": "A",
    "team2": "B",
    "data_meczu": {
      "_seconds": 1772535600,
      "_nanoseconds": 0
    },
    "anulowane": false,
    "zakonczone": true,
    "statystyki": [
      {
        "id": "gracz",
        "zabójstwa": 0,
        "asysty": 0,
        "zgony": 0,
        "MvP": 0
      },
      {
        "id": "nowy_gracz",
        "MvP": 0,
        "zabójstwa": 0,
        "asysty": 0,
        "zgony": 0
      }
    ]
  }
];

/* Formatowanie daty Firestore */
function formatDate(seconds) {
  const d = new Date(seconds * 1000);
  return d.toLocaleDateString("pl-PL") + " • " + d.toLocaleTimeString("pl-PL", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

/* Generowanie HTML meczu */
function generujMecz(mecz) {
  const data = formatDate(mecz.data_meczu._seconds);

  let statHTML = "";
  if (mecz.zakonczone) {
    statHTML = `
      <div class="details">
        <div class="stats">
          ${mecz.statystyki.map(s => `
            <div class="stat">
              <b>${s.id}</b><br>
              Zabójstwa: <span>${s.zabójstwa}</span><br>
              Zgony: <span>${s.zgony}</span><br>
              Asysty: <span>${s.asysty}</span><br>
              MVP: <span>${s.MvP}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  return `
    <div class="match" onclick="toggle(this)">
      <div class="row">
        <div class="team">${mecz.team1}</div>
        <div class="time">${data}</div>
        <div class="team">${mecz.team2}</div>
      </div>
      ${statHTML}
    </div>
  `;
}

/* Wczytywanie meczów */
function zaladujMecze() {
  const nad = document.getElementById("nadchodzace");
  const zak = document.getElementById("zakonczone");

  mecze.forEach(m => {
    const html = generujMecz(m);
    if (m.zakonczone) zak.innerHTML += html;
    else nad.innerHTML += html;
  });
}

zaladujMecze();

/* Rozwijanie statystyk */
function toggle(el) {
  const details = el.querySelector(".details");
  if (!details) return;
  details.style.display = details.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>

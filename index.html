<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RGB Lamp Controller Bluetooth</title>

<style>
body { background:#111; color:white; font-family:Arial; margin:0; padding:0;}
header { padding:1rem; background:#222; text-align:center; font-size:1.5rem; }
nav { display:flex; justify-content:center; background:#333; flex-wrap:wrap;}
nav button { background:none; border:none; color:#ccc; padding:1rem 2rem; cursor:pointer; font-size:1rem;}
nav button.active { background:#555; color:#fff;}
main { padding:1rem;}
#connectionPage,#gridPage,#musicPage,#modsPage { display:none;}
#grid { display:grid; grid-template-columns:repeat(9,40px); grid-gap:4px; justify-content:center; margin:20px 0;}
.cell { width:40px; height:40px; background:black; border-radius:4px; cursor:pointer;}
.color-picker { text-align:center; margin-bottom:15px;}
.color-circle { display:inline-block; width:35px; height:35px; border-radius:50%; margin:5px; cursor:pointer; border:3px solid transparent;}
.color-circle.selected { border-color:yellow;}
#modsPage button { margin:5px; padding:0.5rem 1rem; background:#444; color:white; border:none; border-radius:4px; cursor:pointer;}
button { padding:10px 15px; margin:5px; cursor:pointer;}
</style>
</head>

<body>

<header>RGB Lamp Controller Bluetooth</header>

<nav>
<button id="btnConnect" class="active">Połączenie</button>
<button id="btnGrid">Siatka LED</button>
<button id="btnMusic">Mod muzyczny</button>
<button id="btnMods">Mody</button>
</nav>

<main>

<section id="connectionPage">
<button id="btnRequestBluetooth">Połącz przez Bluetooth</button>
<p id="connStatus">Nie połączono</p>
</section>

<section id="gridPage">

<div class="color-picker">
<div id="red" class="color-circle selected" style="background:red;"></div>
<div id="green" class="color-circle" style="background:green;"></div>
<div id="blue" class="color-circle" style="background:blue;"></div>
<div id="yellow" class="color-circle" style="background:yellow;"></div>
<div id="purple" class="color-circle" style="background:purple;"></div>
<div id="orange" class="color-circle" style="background:orange;"></div>
<div id="pink" class="color-circle" style="background:pink;"></div>
<div id="white" class="color-circle" style="background:white;"></div>
<div id="cyan" class="color-circle" style="background:cyan;"></div>
<div id="lime" class="color-circle" style="background:lime;"></div>
</div>

<div id="grid"></div>

<button id="btnSendGrid">Wyślij do lampy</button>
<button id="btnVoice">🎤 Start nasłuchiwania</button>

<p id="sendStatus"></p>
<p id="voiceStatus"></p>

</section>

<section id="musicPage">
<p>Mod muzyczny (opcjonalny)</p>
</section>

<section id="modsPage">
<h3>Efekty</h3>
<button onclick="rainbowMode()">Tęcza</button>
<button onclick="blinkMode()">Miganie</button>
<button onclick="waveMode()">Fale</button>
<button onclick="pulseMode()">Pulsowanie</button>
<button onclick="showText()">ZSE</button>
</section>

</main>

<script>

const NUM_LEDS = 81;

/* NAWIGACJA */
const btnConnect=document.getElementById('btnConnect');
const btnGrid=document.getElementById('btnGrid');
const btnMusic=document.getElementById('btnMusic');
const btnMods=document.getElementById('btnMods');

const connectionPage=document.getElementById('connectionPage');
const gridPage=document.getElementById('gridPage');
const musicPage=document.getElementById('musicPage');
const modsPage=document.getElementById('modsPage');

function showPage(page){
connectionPage.style.display="none";
gridPage.style.display="none";
musicPage.style.display="none";
modsPage.style.display="none";
page.style.display="block";
}

function setActiveButton(btn){
[btnConnect,btnGrid,btnMusic,btnMods].forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

btnConnect.onclick=()=>{showPage(connectionPage);setActiveButton(btnConnect);}
btnGrid.onclick=()=>{showPage(gridPage);setActiveButton(btnGrid);}
btnMusic.onclick=()=>{showPage(musicPage);setActiveButton(btnMusic);}
btnMods.onclick=()=>{showPage(modsPage);setActiveButton(btnMods);}
showPage(connectionPage);

/* BLUETOOTH */
let writeCharacteristic;
const SERVICE_UUID='12345678-1234-1234-1234-1234567890ab';
const CHARACTERISTIC_UUID='87654321-4321-4321-4321-0987654321ba';

document.getElementById("btnRequestBluetooth").onclick=async()=>{
try{
const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE_UUID]});
const server=await device.gatt.connect();
const service=await server.getPrimaryService(SERVICE_UUID);
writeCharacteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);
connStatus.textContent="Połączono";
}catch(e){connStatus.textContent="Błąd: "+e;}
};

/* GRID */
const grid=document.getElementById("grid");
const colors={red:"#FF0000",green:"#00FF00",blue:"#0000FF",yellow:"#FFFF00",purple:"#800080",orange:"#FFA500",pink:"#FFC0CB",white:"#FFFFFF",cyan:"#00FFFF",lime:"#32CD32",black:"#000000"};
let selectedColor="red";
let cells=[];

document.querySelectorAll(".color-circle").forEach(el=>{
el.onclick=()=>{
document.querySelectorAll(".color-circle").forEach(c=>c.classList.remove("selected"));
el.classList.add("selected");
selectedColor=el.id;
};
});

for(let i=0;i<NUM_LEDS;i++){
const cell=document.createElement("div");
cell.className="cell";
cell.style.backgroundColor=colors.black;
cell.onclick=()=>{cell.style.backgroundColor=colors[selectedColor];};
grid.appendChild(cell);
cells.push(cell);
}

/* WYSYŁANIE */
async function sendToLamp(){
if(!writeCharacteristic)return;
let data=new Uint8Array(NUM_LEDS*3);
for(let i=0;i<NUM_LEDS;i++){
let m=cells[i].style.backgroundColor.match(/\d+/g);
let r=m?+m[0]:0,g=m?+m[1]:0,b=m?+m[2]:0;
data[i*3]=r;data[i*3+1]=g;data[i*3+2]=b;
}
await writeCharacteristic.writeValue(data);
}

/* ====== POPRAWIONY WYRAŹNY NAPIS ====== */

function showText(){

const text=" ZAPRASZAMY DO ZSE ";
let offset=0;

const font={
"Z":["11111","00001","00010","00100","01000","10000","11111"],
"A":["01110","10001","10001","11111","10001","10001","10001"],
"P":["11110","10001","10001","11110","10000","10000","10000"],
"R":["11110","10001","10001","11110","10100","10010","10001"],
"S":["01111","10000","10000","01110","00001","00001","11110"],
"M":["10001","11011","10101","10101","10001","10001","10001"],
"Y":["10001","10001","01010","00100","00100","00100","00100"],
"D":["11110","10001","10001","10001","10001","10001","11110"],
"O":["01110","10001","10001","10001","10001","10001","01110"],
"E":["11111","10000","10000","11110","10000","10000","11111"],
" ":["00000","00000","00000","00000","00000","00000","00000"]
};

setInterval(async()=>{
cells.forEach(c=>c.style.backgroundColor="black");

for(let col=0;col<9;col++){
let charIndex=Math.floor((col+offset)/6);
let char=text[charIndex%text.length];
let fontCol=(col+offset)%6;

if(fontCol<5){
for(let row=0;row<7;row++){
if(font[char] && font[char][row][fontCol]==="1"){
let y=row+1;
let index=y*9+col;
cells[index].style.backgroundColor="#FFFFFF";
}
}
}
}

offset++;
await sendToLamp();

},150);

}

</script>
</body>
</html>

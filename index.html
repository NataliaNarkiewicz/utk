<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mecze</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');

:root {
    --orange: #ff9e1b;
    --bg: #0f1214;
    --card: #1a1d20;
    --border: #32383e;
    --muted: #9a9ea3;
    --fd: 'Rajdhani', sans-serif;
    --fb: 'Inter', sans-serif;
    --fm: 'Roboto Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
    margin: 0; height: 100%; min-height: 100vh;
    font-family: var(--fb); font-size: 15px; color: #fff;
    background: var(--bg) radial-gradient(circle at center, #1e2226, var(--bg));
    display: flex; flex-direction: column;
}

/* TOPBAR */
.topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 50px; position: sticky; top: 0; z-index: 100;
    background: rgba(26,29,32,.98); border-bottom: 3px solid var(--orange);
    box-shadow: 0 4px 20px rgba(0,0,0,.8);
}
.logo-container { display: flex; align-items: center; gap: 14px; }
.school-logo { height: 52px; filter: drop-shadow(0 0 8px rgba(255,158,27,.5)); }
.brand { display: flex; flex-direction: column; }
.logo-text {
    font-family: var(--fd); font-size: 20px; font-weight: 900;
    letter-spacing: 4px; line-height: 1;
    text-shadow: 0 0 20px rgba(255,158,27,.4);
}
.sub-text {
    font-family: var(--fm); font-size: 10px; letter-spacing: 3px;
    color: var(--orange); opacity: .8; text-transform: uppercase;
}
.nav-left a {
    margin-right: 0; text-decoration: none; color: var(--muted);
    font-family: var(--fd); font-size: 16px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; transition: .3s;
    padding: 0 20px; border-right: 1px solid var(--border);
}
.nav-left a:last-child { border-right: none; }
.nav-left a:hover, .nav-left a.active {
    color: var(--orange); text-shadow: 0 0 10px rgba(255,158,27,.5);
}

.social-icons { display: flex; align-items: center; gap: 20px; }
.social-icons a {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border: 1px solid var(--border);
    border-radius: 4px; background: rgba(255,255,255,.05);
    transition: all .3s cubic-bezier(.4,0,.2,1);
}
.social-icons img { width: 22px; height: 22px; filter: opacity(.7); transition: all .3s; }
.social-icons a:hover {
    background: rgba(255,158,27,.1); border-color: var(--orange);
    transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,158,27,.3);
}
.social-icons a:hover img { filter: opacity(1) drop-shadow(0 0 5px var(--orange)); transform: scale(1.1); }

/* MAIN */
main { max-width: 900px; width: 100%; margin: 40px auto; padding: 0 20px 40px; flex: 1; }
.tab { display: none; animation: fadeIn .4s ease-out; }
.tab.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

h2 {
    font-family: var(--fd); font-size: 2rem; font-weight: 700;
    letter-spacing: 8px; text-transform: uppercase; color: #fff;
    border-left: 5px solid var(--orange); padding-left: 15px; margin-bottom: 30px;
    text-shadow: 0 0 30px rgba(255,158,27,.25);
}
h3 {
    font-family: var(--fd); font-size: 1rem; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: var(--orange); margin-top: 0;
}

/* MECZE – nowe klasy dopasowane do stylu */
.section-title {
    font-family: var(--fd);
    font-size: 1rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--orange);
    margin: 25px 0 15px;
    border-left: 4px solid var(--orange);
    padding-left: 10px;
}

.matches {
    display: grid;
    gap: 12px;
}

.match {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    cursor: pointer;
    transition: .25s;
}
.match:hover {
    border-color: var(--orange);
    box-shadow: 0 0 15px rgba(255,158,27,.25);
    transform: translateY(-2px);
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.team {
    font-family: var(--fd);
    font-size: 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.time {
    font-family: var(--fm);
    font-size: 0.8rem;
    color: var(--muted);
}

.details {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}

/* Scoreboard w stylu CS2 */
.scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.team-column {
    background: #15181b;
    border: 1px solid var(--border);
    padding: 10px;
}

.team-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-family: var(--fd);
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--orange);
}

.player-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.player-card {
    display: grid;
    grid-template-columns: 1.6fr 0.7fr 0.7fr 0.7fr 0.7fr;
    align-items: center;
    padding: 6px 8px;
    background: #101316;
    border: 1px solid #22272c;
    font-family: var(--fm);
    font-size: 0.78rem;
    color: #d0d3d7;
}
.player-card.leader {
    border-color: var(--orange);
    box-shadow: 0 0 10px rgba(255,158,27,.25);
    background: radial-gradient(circle at left, rgba(255,158,27,.18), #101316);
}

.player-name {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--fd);
    letter-spacing: 1px;
}
.crown {
    color: var(--orange);
    font-size: 0.9rem;
}

.player-stat-label {
    color: var(--muted);
    font-size: 0.7rem;
}

/* FOOTER */
footer {
    position: sticky; bottom: 0; z-index: 99;
    background: rgba(15,18,20,.98); border-top: 2px solid var(--orange);
    box-shadow: 0 -4px 20px rgba(0,0,0,.7);
}
.footer-inner {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 50px; max-width: 1400px; margin: 0 auto; width: 100%;
}
.footer-inner p { margin: 0; font-family: var(--fm); color: var(--muted); font-size: 12px; letter-spacing: 1px; }
.footer-links { display: flex; gap: 12px; }
.footer-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 18px; font-family: var(--fd); font-size: 10px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all .25s;
    clip-path: polygon(5% 0%,100% 0%,95% 100%,0% 100%);
}
.footer-btn:hover {
    border-color: var(--orange); color: var(--orange);
    background: rgba(255,158,27,.08); box-shadow: 0 0 10px rgba(255,158,27,.2);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .topbar { flex-direction: column; gap: 15px; padding: 20px; }
    .footer-inner { flex-direction: column; gap: 10px; padding: 15px 20px; text-align: center; }
    .scoreboard { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="topbar">
    <div class="logo-container">
        <img src="logo.png" alt="Logo" class="school-logo">
        <div class="brand">
            <div class="logo-text">ZSE ESPORT</div>
            <div class="sub-text">TURNIEJ CS2</div>
        </div>
    </div>
    <nav class="nav-left">
        <a href="#" class="active">Mecze</a>
   
    </nav>
    <div class="social-icons">
        <a href="#"><img src="discord.png" alt="Discord"></a>
        <a href="#"><img src="twitch.png" alt="Twitch"></a>
    </div>
</header>

<main>
    <h2>Mecze</h2>

    <div class="section-title">Nadchodzące mecze</div>
    <div id="nadchodzace" class="matches"></div>

    <div class="section-title">Zakończone mecze</div>
    <div id="zakonczone" class="matches"></div>
</main>

<footer>
    <div class="footer-inner">
        <p>© 2026 ZSE Esport • Tablica meczów CS2</p>
        <div class="footer-links">
           
        </div>
    </div>
</footer>

<script>
// PRZYKŁADOWA BAZA DANYCH
const mecze = [
  {
    id: "A_B",
    team1: "DRUŻYNA A",
    team2: "DRUŻYNA B",
    data_meczu: {
      _seconds: 1772535600,
      _nanoseconds: 0
    },
    anulowane: false,
    zakonczone: true,
    statystyki: [
      // TEAM 1
      { id: "A_player1", team: 1, zabójstwa: 24, zgony: 12, asysty: 6, MvP: 3 },
      { id: "A_player2", team: 1, zabójstwa: 18, zgony: 10, asysty: 9, MvP: 2 },
      { id: "A_player3", team: 1, zabójstwa: 16, zgony: 14, asysty: 5, MvP: 1 },
      { id: "A_player4", team: 1, zabójstwa: 12, zgony: 15, asysty: 7, MvP: 0 },
      { id: "A_player5", team: 1, zabójstwa: 9,  zgony: 17, asysty: 4, MvP: 0 },
      // TEAM 2 (4 graczy – razem 9)
      { id: "B_player1", team: 2, zabójstwa: 22, zgony: 11, asysty: 8, MvP: 4 },
      { id: "B_player2", team: 2, zabójstwa: 17, zgony: 13, asysty: 6, MvP: 1 },
      { id: "B_player3", team: 2, zabójstwa: 14, zgony: 16, asysty: 5, MvP: 0 },
      { id: "B_player4", team: 2, zabójstwa: 8,  zgony: 18, asysty: 3, MvP: 0 }
    ]
  },
  {
    id: "C_D",
    team1: "DRUŻYNA C",
    team2: "DRUŻYNA D",
    data_meczu: {
      _seconds: 1773000000,
      _nanoseconds: 0
    },
    anulowane: false,
    zakonczone: false,
    statystyki: []
  }
];

function formatDate(seconds) {
  const d = new Date(seconds * 1000);
  return d.toLocaleDateString("pl-PL") + " • " +
         d.toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
}

function kdRatio(player) {
  if (player.zgony === 0) return player.zabójstwa || 0;
  return player.zabójstwa / player.zgony;
}

function generujScoreboard(mecz) {
  const team1Players = mecz.statystyki.filter(s => s.team === 1);
  const team2Players = mecz.statystyki.filter(s => s.team === 2);

  team1Players.sort((a, b) => kdRatio(b) - kdRatio(a));
  team2Players.sort((a, b) => kdRatio(b) - kdRatio(a));

  const leader1 = team1Players[0];
  const leader2 = team2Players[0];

  const renderPlayer = (p, isLeader) => `
    <div class="player-card ${isLeader ? "leader" : ""}">
      <div class="player-name">
        ${isLeader ? '<span class="crown">👑</span>' : ""}
        <span>${p.id}</span>
      </div>
      <div><span class="player-stat-label">K/D</span> ${kdRatio(p).toFixed(2)}</div>
      <div><span class="player-stat-label">K</span> ${p.zabójstwa}</div>
      <div><span class="player-stat-label">D</span> ${p.zgony}</div>
      <div><span class="player-stat-label">A</span> ${p.asysty}</div>
    </div>
  `;

  return `
    <div class="scoreboard">
      <div class="team-column">
        <div class="team-header">
          <span>${mecz.team1}</span>
          <span>Gracze</span>
        </div>
        <div class="player-list">
          ${team1Players.map(p => renderPlayer(p, p === leader1)).join("")}
        </div>
      </div>
      <div class="team-column">
        <div class="team-header">
          <span>${mecz.team2}</span>
          <span>Gracze</span>
        </div>
        <div class="player-list">
          ${team2Players.map(p => renderPlayer(p, p === leader2)).join("")}
        </div>
      </div>
    </div>
  `;
}

function generujMecz(mecz) {
  const data = formatDate(mecz.data_meczu._seconds);

  let detailsHTML = "";
  if (mecz.zakonczone && mecz.statystyki && mecz.statystyki.length > 0) {
    detailsHTML = `
      <div class="details">
        ${generujScoreboard(mecz)}
      </div>
    `;
  }

  return `
    <div class="match" onclick="toggleDetails(this)">
      <div class="row">
        <div class="team">${mecz.team1}</div>
        <div class="time">${data}</div>
        <div class="team">${mecz.team2}</div>
      </div>
      ${detailsHTML}
    </div>
  `;
}

function zaladujMecze() {
  const nad = document.getElementById("nadchodzace");
  const zak = document.getElementById("zakonczone");

  mecze.forEach(m => {
    const html = generujMecz(m);
    if (m.zakonczone) zak.innerHTML += html;
    else nad.innerHTML += html;
  });
}

function toggleDetails(el) {
  const details = el.querySelector(".details");
  if (!details) return;
  details.style.display = details.style.display === "block" ? "none" : "block";
}

zaladujMecze();
</script>

</body>
</html>
